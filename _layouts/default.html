<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include nav.html %}
    <main class="page-shell" id="main-content">
      <div class="content-inner">
        {{ content }}
      </div>
    </main>
    {% include footer.html %}
    {% include modals.html %}
    <button id="scrollButton" class="scroll-button" type="button" aria-label="Scroll to top or bottom">&#8595;</button>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
