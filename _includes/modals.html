<div class="modal" id="resume-modal" aria-hidden="true">
  <div class="modal__dialog modal__dialog--wide" role="dialog" aria-modal="true" aria-labelledby="resume-modal-title">
    <div class="modal__header">
      <h2 class="modal__title" id="resume-modal-title">Resume</h2>
      <div class="modal__header-actions">
        <a class="btn btn--small" href="{{ site.data.profiles.resume | relative_url }}" target="_blank" rel="noopener" download>Download PDF</a>
        <button type="button" class="modal__close" data-modal-close aria-label="Close resume viewer">&times;</button>
      </div>
    </div>
    <div class="modal__body modal__body--frame">
      <iframe id="resume-frame" title="Resume PDF" loading="lazy"></iframe>
    </div>
  </div>
</div>

<div class="modal" id="contact-modal" aria-hidden="true">
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
    <div class="modal__header">
      <h2 class="modal__title" id="contact-modal-title">Contact</h2>
      <button type="button" class="modal__close" data-modal-close aria-label="Close contact dialog">&times;</button>
    </div>
    <div class="modal__body">
      <ul class="contact-list">
        <li class="contact-item">
          <span class="contact-icon" aria-hidden="true">📧</span>
          <span class="contact-text">{{ site.data.profiles.email_display }}</span>
        </li>
        <li class="contact-item">
          <span class="contact-icon" aria-hidden="true">🏛️</span>
          <span class="contact-text">{{ site.data.profiles.affiliation }}</span>
        </li>
        {% for link in site.data.profiles.links %}
        <li class="contact-item">
          <span class="contact-icon" aria-hidden="true">🔗</span>
          <a class="contact-link" href="{{ link.url }}" target="_blank" rel="noreferrer noopener">{{ link.label }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
