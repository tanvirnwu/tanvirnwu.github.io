<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign page_title = page.title | default: site.title %}
{% if page.title and page.title != site.title %}{% assign page_title = page.title | append: " · " | append: site.title %}{% endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta name="author" content="{{ site.author.name }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ site.logo | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta name="twitter:image" content="{{ site.logo | absolute_url }}">

<link rel="icon" type="image/svg+xml" href="{{ '/assets/tanvir_logo.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ site.logo | relative_url }}">

<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

{% if page.url == "/" or page.url == "/index.html" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}",
  "image": "{{ site.logo | absolute_url }}",
  "jobTitle": "{{ site.data.profiles.role }}",
  "affiliation": { "@type": "Organization", "name": "{{ site.data.profiles.affiliation }}" },
  "sameAs": [
    {% for link in site.data.profiles.links %}"{{ link.url }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
{% endif %}
