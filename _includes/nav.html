<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Home">
        <img src="{{ '/assets/tanvir_logo.svg' | relative_url }}" alt="Site logo" width="52" height="52">
      </a>

      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
      </button>

      <div class="nav-menu" id="nav-menu">
        <ul class="nav-links">
          <li><a class="page-link{% if page.url == '/' or page.url == '/index.html' %} is-active{% endif %}" href="{{ '/' | relative_url }}">About</a></li>
          {% for path in site.header_pages %}
            {% assign my_page = site.pages | where: "path", path | first %}
            {% if my_page %}
              <li><a class="page-link{% if page.url == my_page.url %} is-active{% endif %}" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
        <ul class="nav-links nav-links--actions">
          <li><button class="page-link resume-trigger" type="button" data-resume-src="{{ site.data.profiles.resume | relative_url }}">Resume</button></li>
          <li><button class="page-link contact-trigger" type="button">Contact</button></li>
          <li>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
              <svg class="theme-toggle__sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="theme-toggle__moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
